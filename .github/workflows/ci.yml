# CI: the workflow that runs on a pull request and on main.
#
# Until this existed the only workflows in this repository were Dependabot and
# CodeQL, so nothing ever installed the dependency graph, type checked it, or
# built it. A pull request could break the app completely and every check would
# still be green.
#
# The build step is not decoration. `tsc` passing says the types line up; it
# says nothing about whether Metro can resolve the graph, whether the Tailwind
# pipeline emits the utility stylesheet the web build needs, or whether the
# app bundles at all. `expo export` is the cheapest check that answers those.
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# A superseded pull request run proves nothing about the commit that replaced
# it. On main it is the other way round, because a cancelled run is a check
# that never reported, so only pull requests cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.3'
  NODE_VERSION: '22.17.0'

jobs:
  # The Seldon race (OxyHQ/oxy docs/engineering/build-and-deploy.md, CI on
  # Seldon), opt-in with the repository variable CI_SELDON_RACE=true, on
  # same-repository pull requests and merge_group only; push and dispatch runs
  # stay hosted. Unset, every job runs hosted as before and none of these takes
  # a runner. Set, `quality` (a full typecheck plus both bundles) runs on the
  # self-hosted seldon-ci pool; a lane still queued 3 minutes after it was
  # created gets its hosted twin (`quality-hosted`), the lane that starts first
  # wins and the finish job cancels the other through its job-level concurrency
  # group. A Seldon lane that fails, whatever the reason (the house network
  # drops new connections in bursts), reruns hosted in `quality-rescue`, which
  # fails again on a genuine failure. CI complete takes the verdict from the race.
  race:
    if: ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-start.yml@main
    permissions:
      actions: read

  race-finish:
    needs: race
    # `!cancelled()`: an ancestor skipped on this event must not skip it.
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    uses: OxyHQ/oxy/.github/workflows/seldon-race-finish.yml@main
    permissions:
      actions: read

  quality:
    name: Typecheck, lint, test and build
    runs-on: ${{ vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork && 'seldon-ci' || 'ubuntu-latest' }}
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-seldon-Typecheck, lint, test and build
    permissions: &race-lane-permissions
      contents: read
      actions: read # the Seldon race guard reads this run's jobs
    timeout-minutes: 60
    steps: &quality-steps
      # A lane that starts after its hosted twin waits here to be cancelled (the Seldon race).
      - name: Seldon race guard
        if: vars.CI_SELDON_RACE == 'true' && !endsWith(github.job, '-rescue')
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: guard
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The Expo CLI runs on Node, so the version it runs on is pinned rather
      # than inherited from whatever the runner image ships this month.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # This job wants the exact graph the lockfile records. It is NOT a
      # lockfile sync check and must not be mistaken for one. That is the
      # `lockfile` job below, which needs a plain install and so cannot share
      # this step.
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts

      # One copy of every package one version can serve and of every package
      # that must be single (@oxy.so/*, react, expo, ...), Oxy releases inside
      # their upgrade window, and the native peers @oxy.so/services requires,
      # declared here so `expo install` pins them to this app's Expo SDK.
      - name: Oxy dependency health (oxy-doctor)
        run: bun run doctor:oxy

      - name: Typecheck
        run: bun run typecheck

      # Biome owns formatting and linting. `biome ci` is the read-only form of
      # `biome check`: it fails on unformatted files instead of rewriting them.
      - name: Biome
        run: bunx biome ci .

      # The minimal ESLint config keeps only the Expo env-var rules Biome has no
      # equivalent for. `expo lint .`, not bare `expo lint`: the bare form only
      # lints app/, components/ and src/, and every EXPO_PUBLIC_* read lives in
      # lib/config.ts.
      - name: Expo lint
        run: bunx expo lint .

      # The TOTP generator is the whole point of this app, and its suite pins it
      # against the RFC 6238 vectors rather than against itself.
      - name: Test
        run: bun run test

      - name: Build web bundle
        run: bun run export:web

      # The native bundle is a genuinely different code path, not a duplicate of
      # the web one: react-native-css compiles global.css through lightningcss
      # for native instead of the PostCSS pipeline the web build uses, and the
      # result is compiled to Hermes bytecode. A tree that exports a perfectly
      # good web bundle can fail to bundle for a device at all, which is exactly
      # what happened here before `overrides.lightningcss` was pinned. Metro
      # needs no Android or Xcode toolchain to produce this, so it costs a
      # minute and covers a failure the web build cannot see.
      - name: Build native bundle
        run: bun run export:native

      # A silently inert Tailwind pipeline is the failure this repository is
      # most exposed to: react-native-css emits real CSS classes on web rather
      # than runtime styles, so without a compiled utility stylesheet every
      # layout class is a no-op while colours still look right, which is exactly
      # the shape that survives review. Assert the stylesheet exists and that a
      # utility the app actually uses made it in.
      - name: Assert the web build emitted a utility stylesheet
        run: |
          set -euo pipefail
          css="$(find dist/_expo/static/css -name 'global-*.css' -print -quit)"
          if [ -z "$css" ]; then
            echo "::error::no compiled Tailwind stylesheet in dist/_expo/static/css"
            exit 1
          fi
          for utility in 'flex-row' 'bg-card' 'text-muted-foreground'; do
            if ! grep -qF -- "$utility" "$css"; then
              echo "::error::utility '$utility' is missing from $css, so the NativeWind/Tailwind pipeline is not wired"
              exit 1
            fi
          done
          echo "utility stylesheet: $css"

  # quality's hosted twin in the Seldon race: the same name and steps.
  quality-hosted:
    name: Typecheck, lint, test and build
    needs: race
    if: ${{ !cancelled() && needs.race.outputs.race == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: seldon-race-${{ github.run_id }}-${{ github.run_attempt }}-hosted-Typecheck, lint, test and build
    permissions: *race-lane-permissions
    steps: *quality-steps

  # quality's rescue: reruns it hosted when its Seldon lane failed (the house
  # network drops connections); a genuine failure fails again.
  quality-rescue:
    name: Typecheck, lint, test and build
    needs: quality
    if: ${{ !cancelled() && needs.quality.result == 'failure' && vars.CI_SELDON_RACE == 'true' && github.run_attempt == 1 && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: *race-lane-permissions
    steps: *quality-steps

  lockfile:
    name: Lockfile is in sync with package.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Deliberately a plain install rather than `--frozen-lockfile`. The frozen
      # flag only fails when a range resolves to nothing at all, so it passes
      # cleanly on the desync that actually reaches main: a dependency range
      # widened to something the lockfile does not record but the already-locked
      # resolution still satisfies. Resolving for real and asking git whether
      # bun.lock moved is what catches that.
      - name: Resolve dependencies
        run: bun install --ignore-scripts

      - name: Assert bun.lock did not move
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- bun.lock; then
            echo "::error::bun.lock is out of sync with package.json. Run 'bun install' and commit the lockfile in the same commit"
            exit 1
          fi

  # The one check this workflow stands for, modelled on OxyHQ/Gemies' and
  # OxyHQ/Bloom's: green only when every job above passed, so a cancelled or
  # skipped job can never read as a pass. Required checks by job name cannot
  # follow the Seldon race (a twin and a rescue share their job's name, and a
  # cancelled loser is not a failure); this one can. The only skips it allows
  # are the race's jobs, twin and rescue when they are not needed. When the
  # race or the rescue ran, `quality` passes on the race's verdict: its name
  # passed in some lane and failed in no hosted lane.
  ci-complete:
    name: CI complete
    if: always()
    # Not race-finish: its reapers run on seldon-ci-light and only follow the
    # cancellation, so needing it would wait on Seldon.
    needs: [race, quality, quality-hosted, quality-rescue, lockfile]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the Seldon race verdict reads this run's jobs
    steps:
      # Passed when one of quality's lanes succeeded and no hosted lane failed.
      # Whenever the race is on: a rescue can run without the race.
      - name: Seldon race verdict
        id: race
        if: vars.CI_SELDON_RACE == 'true'
        uses: OxyHQ/oxy/.github/actions/seldon-race@main
        with:
          mode: verdict
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          RACE_VERDICT: ${{ steps.race.outputs.outcome }}
        run: |
          set -euo pipefail
          failures=()
          result() { jq -r --arg job "$1" '.[$job].result // "missing"' <<<"$RESULTS"; }

          # The race's start: skipped when not needed, never failed.
          race="$(result race)"
          case "$race" in
            success | skipped) ;;
            *) failures+=("race did not pass: $race") ;;
          esac

          # quality, its twin and its rescue: the verdict when the race ran or
          # the rescue ran; otherwise quality's own, with the twin skipped.
          own="$(result quality)"
          twin="$(result quality-hosted)"
          rescue="$(result quality-rescue)"
          raced="$(jq -r '.race.outputs.race // ""' <<<"$RESULTS")"
          if [ "$rescue" != skipped ] || [ "$raced" = true ]; then
            quality="${RACE_VERDICT:-no verdict}"
          else
            [ "$twin" = skipped ] || failures+=("quality-hosted ran although the Seldon race did not: $twin")
            quality="$own"
          fi
          [ "$quality" = success ] || failures+=("quality did not pass: $quality")

          lockfile="$(result lockfile)"
          [ "$lockfile" = success ] || failures+=("lockfile did not pass: $lockfile")

          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do
              echo "::error::$failure"
            done
            exit 1
          fi
          echo 'Every job passed.'
